[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "project-setup"
version = "1.0.2"
description = "Portable macOS/Linux project scaffolding and release CLI"
requires-python = ">=3.9"

[project.scripts]
git-setup = "project_setup.gitsetup:main"
project-setup = "project_setup.cli:setup_main"
project-update = "project_setup.cli:update_main"

[tool.setuptools]
packages = ["project_setup"]

[tool.setuptools.package-data]
project_setup = ["template/*", "template/.gitignore", "template/**/*"]

[tool.setuptools.exclude-package-data]
project_setup = ["**/__pycache__/*", "**/*.pyc", "**/*.pyo"]
