name: tests
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.9', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s testdirectory -v
      - run: python install.py --prefix "$RUNNER_TEMP/project-setup-install"
      - run: '"$RUNNER_TEMP/project-setup-install/bin/project-setup" --project smoke --proj-dir "$RUNNER_TEMP"'
